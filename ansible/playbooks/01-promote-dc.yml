---
- name: Promote DC01 to Domain Controller
  hosts: dc01
  gather_facts: no

  tasks:
    - name: Install AD Domain Services role
      ansible.windows.win_feature:
        name: AD-Domain-Services
        include_management_tools: yes
        state: present

    - name: Install DNS Server role
      ansible.windows.win_feature:
        name: DNS
        include_management_tools: yes
        state: present

    - name: Create range.lab forest
      microsoft.ad.domain:
        dns_domain_name: range.lab
        domain_netbios_name: RANGE
        safe_mode_password: LabAdmin2024!
        install_dns: true
        reboot: true
